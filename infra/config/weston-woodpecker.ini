# weston-woodpecker.ini — Weston config for PinePhone (Woodpecker v0.3, oBzdOS/OpenBSD)
#
# Deploy to: /usr/local/etc/weston-bsdos.ini on the Woodpecker device.
#
# Backend: fbdev-backend.so  — drives /dev/fb0 directly, no DRM node required.
# Mesa GL: MESA_GALLIUM_DRIVER=softpipe / LIBGL_ALWAYS_SOFTWARE=1 — set in
#          the bsdos_display rc.d service env, not here (weston reads GL via
#          EGL; driver selection is env-based, not ini-based).
# Touch:   /dev/input/event0 (evdev) — libinput auto-discovers evdev nodes; no
#          explicit device path needed unless the evdev path differs.
# Display: PinePhone Pro — Rockchip RK3399S, panel 720×1440 portrait.

[core]
# purpose: select compositor backend and disable idle blanking
# input:   bsdos_display_backend rc.conf var selects the .so at runtime;
#          idle-time=0 prevents DPMS blank (fbdev has no DPMS path on FreeBSD)
backend=fbdev-backend.so
idle-time=0
repaint-window=16

[shell]
# purpose: disable lockscreen and transitions (no logind, no locking daemon)
# locking=false: suppress the session-lock interface which requires logind
# animation=none: eliminate compositor transitions; softpipe budget is ~30 fps
locking=false
animation=none

[output]
# purpose: declare the PinePhone Pro framebuffer output
# name: fbdev-backend uses the literal name "LVDS1" for its single output
#       (not "HDMI-1" which is the DRM backend name — that would be ignored here)
# mode: native PinePhone Pro panel resolution, portrait orientation
# transform: normal = no rotation; use 90/270 for landscape-locked apps
name=LVDS1
mode=720x1440
transform=normal

[input]
# purpose: configure libinput for touch-primary device (no physical keyboard)
# disable-touch=false: explicit guard — touch must remain enabled
# tap-to-click and natural-scroll are per-device libinput options;
# weston.ini [input] controls compositor-level seat config only.
# Per-device options (tap, natural-scroll) go in /etc/libinput/local.conf
# on FreeBSD once evdev nodes are confirmed.
disable-touch=false
keyboard-layout=us

[libinput]
# purpose: enable touchscreen tap-to-click and tap-drag for finger UI
# Note: [libinput] section is honoured by weston >= 9; earlier versions silently
#       ignore it — libinput.conf is the fallback in that case.
enable-tap=true
tap-and-drag=true
natural-scroll=false
