# weston-squirrel-qemu.ini — Weston config for Squirrel QEMU dev loop
#
# Deploy to: /usr/local/etc/weston-bsdos.ini inside the QEMU guest (dev-vm/myvm).
#
# Two modes are supported by rc.conf variable bsdos_display_backend:
#
#   (A) drm — interactive sessions via virtio-gpu-gl or QXL/SPICE.
#       Requires:   kldload virtio_gpu (vm-setup-drm.sh)
#                   -device virtio-gpu-pci (or virtio-gpu-gl for virgl) in QEMU flags
#                   WLR_BACKENDS=drm  WLR_RENDERER=gles2  WLR_DRM_DEVICES=/dev/dri/card0
#       Use with:   bsdos_display_backend="drm" in /etc/rc.conf
#
#   (B) headless — bsdos-core streaming path (stream_manager.rs).
#       cage is used instead of weston for this path; weston.ini is not read.
#       WLR_BACKENDS=headless  WLR_RENDERER=pixman are set in bsdos_cage rc.d.
#       This ini is irrelevant for mode B; included for completeness.
#
# Active section below is for mode A (drm/virtio-gpu interactive).

[core]
# purpose: DRM backend for virtio-gpu device exposed by QEMU
# idle-time=0: prevent blank on dev sessions where DPMS is not needed
# repaint-window=16: ~60 fps target; software GL (softpipe/virgl) can sustain this
backend=drm-backend.so
idle-time=0
repaint-window=16

[shell]
# purpose: disable lockscreen for dev environment (no PAM/logind)
locking=false
animation=none

[output]
# purpose: map the virtio-gpu DRM connector
# name: virtio-gpu exposes a single connector named "Virtual-1" in the DRM subsystem
#       on FreeBSD with drm-kmod (QXL may expose "QEMU Monitor" — check with
#       weston-info after first boot).
# mode: match QEMU -vga / SPICE resolution; SPICE default is 1024x768.
# transform: normal (no rotation needed for amd64 dev loop)
name=Virtual-1
mode=1024x768
transform=normal

[input]
# purpose: configure keyboard layout for interactive dev sessions
disable-touch=false
keyboard-layout=us
