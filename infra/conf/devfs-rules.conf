# bsdOS devfs rulesets
# Для использования в /etc/devfs.rules на гостевой системе FreeBSD 15.1
# Подключить: devfs rule -s N add include [ruleset-id] или service devfs restart

# Базовый набор: null, zero, random, fd, pts (ОБЯЗАТЕЛЕН для всех jail)
[bsdos_base=20]
add hide
add path null unhide
add path zero unhide
add path random unhide
add path urandom unhide
add path crypto unhide
add path 'fd' unhide
add path 'fd/*' unhide
add path stdin unhide
add path stdout unhide
add path stderr unhide
add path 'pts/*' unhide
add path ptmx unhide

# Audio jail: наследует базу + audio/mixer devices
[bsdos_audio=21]
add include $bsdos_base
add path 'dsp*' unhide
add path 'mixer*' unhide
add path 'snd*' unhide

# Network jail: наследует базу + BPF (для packet sniffing/monitoring)
[bsdos_net=22]
add include $bsdos_base
add path 'bpf*' unhide
add path tun unhide
add path 'tun*' unhide

# Full-featured jail: наследует audio + net + pts + ptmx
[bsdos_full=23]
add include $bsdos_net
add include $bsdos_audio
