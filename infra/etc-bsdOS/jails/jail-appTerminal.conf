# jail-appTerminal.conf — FreeBSD jail for appTerminal (foot terminal)
# Per SPEC_2stream_squirrel.md §4.1 + §9.2 (internal task).
# Each app gets its own jail + cage instance (2 cage instances, 1 app each).

# Jail identity
appTerminal {
    # ── Hostname + path ────────────────────────────────────────────────────
    host.hostname = "appTerminal.local";
    path = "/opt/bsdos/jails/appTerminal";

    # ── Boot: start cage with foot on wayland-0 ────────────────────────────
    exec.start = "/bin/sh /etc/bsdOS/start-cage.sh appTerminal wayland-0 foot";
    exec.stop  = "/usr/bin/killall -q cage foot 2>/dev/null";
    exec.clean;
    exec.timeout = "30";

    # ── Network: unix-socket only (no network for terminal) ────────────────
    ip4 = disable;
    ip6 = disable;

    # ── Mounts ─────────────────────────────────────────────────────────────
    mount.fstab = "/etc/bsdOS/jails/jail-appTerminal.fstab";
    mount.devfs;                          # /dev with devfs ruleset
    mount.fdescfs;                        # /dev/fd
    mount.procfs = "/proc";               # /proc for process introspection

    # ── Resource limits (rctl) ─────────────────────────────────────────────
    # max memory 32 MB, max processes 16
    # Applied via: rctl -a jail:appTerminal:memoryuse:deny=32M
    #              rctl -a jail:appTerminal:maxproc:deny=16

    # ── Devfs ruleset (restrict device access) ────────────────────────────
    devfs_ruleset = "11";                 # bsdOS ruleset for terminal jails

    # ── Persist ────────────────────────────────────────────────────────────
    persist;

    # ── Security ───────────────────────────────────────────────────────────
    allow.raw_sockets = false;
    allow.sysvipc = false;
    allow.chflags;
    children.max = 16;
}
