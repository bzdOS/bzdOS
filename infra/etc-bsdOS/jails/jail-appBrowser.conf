# jail-appBrowser.conf — FreeBSD jail for appBrowser (Phantom/wpewebkit-fdo browser)
# Per SPEC_2stream_squirrel.md §4.1 + §9.2 (internal task).
# Each app gets its own jail + cage instance (2 cage instances, 1 app each).

# Jail identity
appBrowser {
    # ── Hostname + path ────────────────────────────────────────────────────
    host.hostname = "appBrowser.local";
    path = "/opt/bsdos/jails/appBrowser";

    # ── Boot: start cage with Phantom browser on wayland-1 ─────────────────
    exec.start = "/bin/sh /etc/bsdOS/start-cage.sh appBrowser wayland-1 /usr/local/bin/phantom-browser";
    exec.stop  = "/usr/bin/killall -q cage cog 2>/dev/null";
    exec.clean;
    exec.timeout = "60";                  # browser takes longer to start

    # ── Network: egress only (browser needs HTTP/HTTPS, no ingress) ────────
    # PF rules enforce egress-only via jail-policy-apply (Feature 6)
    ip4 = inherit;                        # share host networking (PF enforces)
    ip6 = inherit;

    # ── Mounts ─────────────────────────────────────────────────────────────
    mount.fstab = "/etc/bsdOS/jails/jail-appBrowser.fstab";
    mount.devfs;
    mount.fdescfs;
    mount.procfs = "/proc";

    # ── Resource limits (rctl) ─────────────────────────────────────────────
    # max memory 512 MB, max processes 64
    # Applied via: rctl -a jail:appBrowser:memoryuse:deny=512M
    #              rctl -a jail:appBrowser:maxproc:deny=64

    # ── Devfs ruleset (allow GPU/drm for webview rendering) ────────────────
    devfs_ruleset = "12";                 # bsdOS ruleset for browser jails

    # ── Persist ────────────────────────────────────────────────────────────
    persist;

    # ── Security ───────────────────────────────────────────────────────────
    allow.raw_sockets = false;
    allow.sysvipc = true;                 # shared memory for webview
    allow.chflags;
    children.max = 64;
}
