# cage.conf — cage Wayland kiosk compositor configuration
# Per SPEC_squirrel_rootfs.md §2 (image layout) + §5.6 (stage configs).

[compositor]
# Backend: drm (virtio-gpu in QEMU), fbdev fallback for headless
backend = "drm"
resolution = "720x1440"

[render]
# Software rendering for Squirrel QEMU (no GPU); Mesa Lima for Chimp/Woodpecker
renderer = "pixman"

[input]
# Input devices: keyboard + pointer from bsdos-core input events
keyboard = true
pointer = true
