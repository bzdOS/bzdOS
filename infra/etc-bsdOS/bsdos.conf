# bsdos.conf — bsdos-core runtime configuration
# Per SPEC_squirrel_rootfs.md §2 (image layout) + §5.6 (stage configs).

[zenoh]
# Zenoh listen endpoint — masked as port 443 in production (SPEC §3.4),
# but 7447 for Squirrel demo/QEMU.
listen = "tcp/0.0.0.0:7447"
mode   = "peer"

[stream]
# Default stream settings (per-stream overrides in .jpk descriptors)
fps     = 30
quality = 80
# LZ4 compression for Wayland buffer relay
compress = "lz4"

[capnproto]
# Cap'n Proto arena size for zero-copy serialization
arena_size_kb = 64

# Autostream: comma-separated list of app_id:cmd pairs launched at boot.
# Overridden by BSDOS_AUTOSTREAM env var if set.
autostream = "appTerminal:foot,appBrowser:phantom-browser"
